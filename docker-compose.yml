version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    env_file: ./backend/.env
    environment:
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file: ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped

  scrapers:
    build:
      context: ./scrapers
      dockerfile: Dockerfile
    env_file: ./scrapers/.env
    depends_on:
      - backend
    restart: unless-stopped
